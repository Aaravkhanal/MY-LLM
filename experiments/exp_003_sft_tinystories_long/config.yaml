name: sft_tinystories_long
description: Full fine-tune of exp_001 on templated story-request conversations built
  from our own corpus.
stage: sft
init_from: experiments/exp_001_tiny_tinystories/checkpoints/final.pt
model_preset: tiny
model_overrides: {}
tokenizer:
  kind: bpe
  vocab_size: 2048
  artifact_dir: artifacts/tokenizer_tinystories_v1
  train_files: []
data:
  sources:
  - data/raw/story_requests_v1.jsonl
  format: auto
  text_field: text
  doc_separator: <|endoftext|>
  out_dir: data/processed/story_sft_v1
  val_fraction: 0.01
  test_fraction: 0.01
  min_chars: 20
  max_chars: 100000
  dedup: true
  seed: 1337
train:
  seed: 1337
  device: auto
  precision: fp32
  max_steps: 2000
  batch_size: 16
  grad_accum: 2
  lr: 0.0003
  min_lr_ratio: 0.1
  warmup_steps: 30
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 250
  eval_iters: 20
  log_interval: 20
  ckpt_interval: 500
  early_stop_patience: 0
  keep_last: 2
  lora_rank: 0
  lora_alpha: 16.0
  lora_dropout: 0.0
