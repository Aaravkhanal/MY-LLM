name: small_ctx1024
description: 'exp_010 continued at block_size 1024 (double the context): does the
  model learn to use the longer window, and at what quality cost to the original 512-token
  behaviour?'
stage: pretrain
init_from: experiments/exp_010_small_long_tinystories/checkpoints/best.pt
model_preset: small
model_overrides:
  block_size: 1024
tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: artifacts/tokenizer_tinystories_v2
  train_files: []
  train_sample_mb: 0.0
data:
  sources:
  - data/raw/tinystories_v2_400mb.txt
  - data/raw/tinystories_v2_part2.txt
  format: txt
  text_field: text
  doc_separator: <|endoftext|>
  out_dir: data/processed/tinystories_v2_1200mb
  val_fraction: 0.005
  test_fraction: 0.005
  min_chars: 100
  max_chars: 20000
  dedup: true
  seed: 1337
train:
  seed: 1337
  device: auto
  precision: fp32
  max_steps: 3000
  batch_size: 1
  grad_accum: 16
  lr: 0.0002
  min_lr_ratio: 0.1
  warmup_steps: 100
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 300
  eval_iters: 50
  eval_batch_size: 2
  log_interval: 25
  ckpt_interval: 300
  early_stop_patience: 0
  keep_last: 2
  lora_rank: 0
  lora_alpha: 16.0
  lora_dropout: 0.0
