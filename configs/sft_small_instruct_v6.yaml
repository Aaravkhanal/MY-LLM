# v6 data = v5 data + both topic words of a two-topic request must be prominent (>=2 mentions) and early (<=40 words). exp_007 passed only
# 2/24 two-topic requests on the final set: the second word was often a passing mention, so the model learned to include one reliably.
# Everything else, including the seed, is exp_008's recipe.
name: sft_small_instruct_v6
description: "exp_008 recipe plus the two-topic fix: both requested words must be prominent and early in the story."
stage: sft
init_from: experiments/exp_004_small_tinystories/checkpoints/best.pt
model_preset: small
model_overrides: {}
tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: artifacts/tokenizer_tinystories_v2
  train_files: []
data:
  sources:
  - data/raw/instruct_v6.jsonl
  format: auto
  text_field: text
  doc_separator: <|endoftext|>
  out_dir: data/processed/instruct_v6_sft
  val_fraction: 0.01
  test_fraction: 0.01
  min_chars: 20
  max_chars: 100000
  dedup: true
  seed: 1337
train:
  seed: 1337
  device: auto
  precision: fp32
  max_steps: 1800
  batch_size: 2
  grad_accum: 16
  eval_batch_size: 4
  lr: 0.0002
  min_lr_ratio: 0.1
  warmup_steps: 60
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 200
  eval_iters: 40
  log_interval: 25
  ckpt_interval: 200
  early_stop_patience: 0
  keep_last: 2
  lora_rank: 0
  lora_alpha: 16.0
  lora_dropout: 0.0
