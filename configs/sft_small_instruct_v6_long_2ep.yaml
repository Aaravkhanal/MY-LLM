# exp_012: exp_011 with 3600 steps instead of 1800 (~1.9 epochs). Nothing else changes (data, seed, lr, warmup), so a difference from exp_011
# is attributable to training longer. Motivation: exp_011 learned content requests but not length control in ~0.96 epoch.
# exp_009's recipe and data, unchanged, on the base that saw 147M more tokens (exp_010). The only difference is the starting weights,
# so a difference from exp_009 is attributable to the base model.
# v6 data = v5 data + both topic words of a two-topic request must be prominent (>=2 mentions) and early (<=40 words). exp_007 passed only
# 2/24 two-topic requests on the final set: the second word was often a passing mention, so the model learned to include one reliably.
# Everything else, including the seed, is exp_008's recipe.
name: sft_small_instruct_v6_long_2ep
description: "exp_011 unchanged except twice the steps (about 1.9 epochs of the v6 data): tests whether a second epoch recovers length control on the better base."
stage: sft
init_from: experiments/exp_010_small_long_tinystories/checkpoints/best.pt
model_preset: small
model_overrides: {}
tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: artifacts/tokenizer_tinystories_v2
  train_files: []
data:
  sources:
  - data/raw/instruct_v6.jsonl
  format: auto
  text_field: text
  doc_separator: <|endoftext|>
  out_dir: data/processed/instruct_v6_sft
  val_fraction: 0.01
  test_fraction: 0.01
  min_chars: 20
  max_chars: 100000
  dedup: true
  seed: 1337
train:
  seed: 1337
  device: auto
  precision: fp32
  max_steps: 3600
  batch_size: 2
  grad_accum: 16
  eval_batch_size: 4
  lr: 0.0002
  min_lr_ratio: 0.1
  warmup_steps: 60
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 200
  eval_iters: 40
  log_interval: 25
  ckpt_interval: 200
  early_stop_patience: 0
  keep_last: 2
  lora_rank: 0
  lora_alpha: 16.0
  lora_dropout: 0.0
