# exp_008: continued pretraining of the 14M `small` model (exp_004) on TinyStories text it has NEVER seen.
# exp_004 used the first 400 MB (0.87 epoch, 90M tokens, loss still falling). This run adds ~147M tokens (9,000 x 16,384) drawn
# from a 1.2 GB corpus (the same 400 MB + the next 800 MB), i.e. about half an epoch, so nothing is repeated.
#
# Weights only carry over (init_from): fresh AdamW state, a new warmup, cosine to 10%. Peak LR 5e-4 is below exp_004's 8e-4
# because the weights are already trained. The tokenizer is the existing one (artifacts/tokenizer_tinystories_v2), reused.
# The content-hash split is unchanged for old stories, so exp_004's validation/test stories stay held out; the validation set
# also gains stories from the new slice, so compare models on THIS split (evaluate exp_004 on it too).
name: small_long_tinystories
description: exp_004 + 147M new tokens of TinyStories (continued pretraining, 14.16M parameters).
model_preset: small
init_from: experiments/exp_004_small_tinystories/checkpoints/best.pt

tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: artifacts/tokenizer_tinystories_v2
  train_sample_mb: 100

data:
  sources: [data/raw/tinystories_v2_400mb.txt, data/raw/tinystories_v2_part2.txt]
  format: txt
  doc_separator: "<|endoftext|>"
  out_dir: data/processed/tinystories_v2_1200mb
  val_fraction: 0.005
  test_fraction: 0.005
  min_chars: 100
  max_chars: 20000
  dedup: true
  seed: 1337

train:
  seed: 1337
  device: auto
  precision: fp32
  max_steps: 9000
  batch_size: 1
  grad_accum: 32
  eval_batch_size: 4
  lr: 0.0005
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 1000
  eval_iters: 100
  log_interval: 25
  ckpt_interval: 500
  keep_last: 2
