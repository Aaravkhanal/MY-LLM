# v2: the 14M-parameter `small` preset on ~7x more data than v1, with a 4,096-token tokenizer.
# Micro-batch 1 x accumulation 32 x 512 tokens = 16,384 tokens/step. On this 8 GB Mac bigger micro-batches
# are SLOWER: measured 6.6k tok/s at 1 (0.6 GB of Metal memory) vs 4.4k at 3 and 3.7k at 4 (2.3 GB, which
# pushes macOS into compressing/swapping); 16 needs 5.5 GB. Accumulation gives identical maths.
# Source: TinyStories V2 (GPT-4), first ~400 MB. CDLA-Sharing-1.0.
name: small_tinystories
description: 14M Llama-style model, byte-level BPE (4096), ~90M tokens of TinyStories.
model_preset: small

tokenizer:
  kind: bpe
  vocab_size: 4096
  artifact_dir: artifacts/tokenizer_tinystories_v2
  train_sample_mb: 100          # a 4k BPE saturates long before 400 MB; keeps memory low

data:
  sources: [data/raw/tinystories_v2_400mb.txt]
  format: txt
  doc_separator: "<|endoftext|>"
  out_dir: data/processed/tinystories_v2
  val_fraction: 0.005
  test_fraction: 0.005
  min_chars: 100
  max_chars: 20000
  dedup: true
  seed: 1337

train:
  seed: 1337
  device: auto
  precision: fp32
  max_steps: 5500
  batch_size: 1
  grad_accum: 32
  eval_batch_size: 4
  lr: 0.0008
  min_lr_ratio: 0.1
  warmup_steps: 200
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 500
  eval_iters: 100               # x eval_batch_size 4 = 400 windows (~200k tokens); v1's 80-window estimate was noisy
  log_interval: 25
  ckpt_interval: 250
  keep_last: 2
